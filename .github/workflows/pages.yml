name: Déploiement GitHub Pages

# Publie l'interface web (web/ + paquet WASM) à chaque push sur main.
# Prérequis : Settings → Pages → Source = « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM (release)
        run: wasm-pack build crates/farkle-web --release --target web --out-dir ../../web/pkg
      - name: Assemble site
        run: |
          mkdir _site
          cp web/index.html web/style.css web/*.js _site/
          mkdir _site/pkg
          cp web/pkg/farkle_web.js web/pkg/farkle_web_bg.wasm _site/pkg/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
