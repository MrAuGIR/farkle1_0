[package]
name = "farkle-cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "farkle"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
farkle-core = { path = "../farkle-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
