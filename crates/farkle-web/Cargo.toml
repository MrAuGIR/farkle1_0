[package]
name = "farkle-web"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Façade WebAssembly du moteur Farkle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
farkle-core = { path = "../farkle-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
